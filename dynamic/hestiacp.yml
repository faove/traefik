http:
  middlewares:
    panel-auth:
      basicauth:
        users:
          - "admin:$$2y$$05$$cqZX39Rfg7etIK8e.zueUOkc1DgwIiICHuSlh9YDuIVvh4f8UG36W"

  routers:
    # Dominios públicos sin autenticación
    hestiacp-public:
      rule: "Host(`elantar.net`, `www.elantar.net`, `enrolanow.com`, `www.enrolanow.com`, `app.enrolanow.com`, `erpelantar.com`, `www.erpelantar.com`, `dev.erpelantar.com`)"
      entryPoints:
        - websecure
      service: hestiacp-service
      tls:
        certResolver: letsencrypt

    # Panel admin y webmail con BasicAuth
    hestiacp-admin:
      rule: "Host(`panel.erpelantar.com`, `webmail.elantar.net`, `webmail.enrolanow.com`, `webmail.erpelantar.com`)"
      entryPoints:
        - websecure
      service: hestiacp-service
      middlewares:
        - panel-auth
      tls:
        certResolver: letsencrypt

  services:
    hestiacp-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"
        passHostHeader: true